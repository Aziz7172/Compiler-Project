<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f9; }
        nav { background: #2c3e50; padding: 14px 24px; display: flex; gap: 20px; }
        nav a { color: #ecf0f1; text-decoration: none; font-size: 16px; padding: 8px 16px; border-radius: 4px; transition: background 0.2s; }
        nav a:hover { background: #34495e; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #ecf0f1; }
        th { background: #2c3e50; color: #ecf0f1; font-weight: 600; }
        tr:hover { background: #f8f9fa; }
        .btn { padding: 6px 14px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; margin-right: 6px; }
        .btn-edit { background: #3498db; color: #fff; }
        .btn-edit:hover { background: #2980b9; }
        .btn-delete { background: #e74c3c; color: #fff; }
        .btn-delete:hover { background: #c0392b; }
        .btn-view { background: #27ae60; color: #fff; }
        .btn-view:hover { background: #1e8449; }
        .empty { text-align: center; padding: 40px; color: #95a5a6; }
        .search-bar { margin-bottom: 16px; display: flex; justify-content: flex-end; }
        .search-bar input.table-search { width: 260px; padding: 8px 12px; border: 1px solid #dcdde1; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
<nav>
    <a href="index.html">Dashboard</a>
    <a href="products.html">View Products</a>
    <a href="add_product.html">Add Product</a>
    <a href="edit_product.html">Edit Product</a>
</nav>
<div class="container">
    <h1>Products List</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" class="table-search" placeholder="Search products...">
    </div>
    <table class="dynamic-table" data-entity="product">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Details</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Rows are rendered dynamically by script.js from localStorage -->
        </tbody>
    </table>
</div>
<script src="script.js"></script>
</body>
</html>
