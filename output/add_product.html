<!DOCTYPE html>
<html>
<head>
    <title>Add Product </title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f6f9; }
        nav { background: #2c3e50; padding: 14px 24px; display: flex; gap: 20px; }
        nav a { color: #ecf0f1; text-decoration: none; font-size: 16px; padding: 8px 16px; border-radius: 4px; transition: background 0.2s; }
        nav a:hover { background: #34495e; }
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; }
        form { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #2c3e50; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px 12px; margin-bottom: 18px; border: 1px solid #dcdde1; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        button[type="submit"] { background: #27ae60; color: #fff; padding: 12px 24px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button[type="submit"]:hover { background: #1e8449; }
        .back-link { display: inline-block; margin-top: 16px; color: #3498db; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<nav>
    <a href="index.html">Dashboard</a>
    <a href="products.html">View Products</a>
    <a href="add_product.html">Add Product</a>
    <a href="edit_product.html">Edit Product</a>
</nav>
<div class="container">
    <h1>Add New Product</h1>
    <form method="POST" id="productForm" class="generic-form" data-entity="product">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter product name">
        <label for="price">Price</label>
        <input type="number" id="price" name="price" placeholder="Enter price" step="0.01">
        <label for="image">Image URL</label>
        <input type="text" id="image" name="image" placeholder="Enter image URL">
        <label for="details">Details</label>
        <input type="text" id="details" name="details" placeholder="Enter product details">
        <button type="submit">Add Product</button>
    </form>
    <a class="back-link" href="products.html">&larr; Back to Products</a>
</div>
<script src="script.js"></script>
</body>
</html>
